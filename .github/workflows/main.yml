name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Format check with Ruff
        run: ruff format --check src tests
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Test documentation
        run: |
          cp CHANGELOG.md docs/source/changelog.md
          cd docs
          make html
      - name: Upload documentation
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/build/html
  tests:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install .[test]
      - name: Test with pytest
        run: pytest
  publish:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v7
        with:
          name: docs
          path: docs
      - name: add and push
        run: |
          tag_version=${{ github.event.release.tag_name }}
          echo "building doc for $tag_version"
          mkdir "$tag_version"
          mv docs $tag_version
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add --all $tag_version
          git commit -m "new doc for $tag_version"
          git push
  build:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: python -m pip install build
      - name: Build a binary wheel and a source tarball
        run: python -m build --sdist --wheel --outdir dist/
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish distribution package to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish distribution package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

